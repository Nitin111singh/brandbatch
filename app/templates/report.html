{% extends "base.html" %}
{% block title %}Report content{% endblock %}
{% block content %}
<div class="card" style="max-width:620px;margin:0 auto">
  <h1>Report content</h1>
  <p class="sub">Report copyright infringement or content that breaks our <a href="{{ url_for('web.content_policy') }}">content policy</a>. We respond within 72 hours.</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="f" for="email">Your email</label>
    <input type="email" id="email" name="email" required value="{{ form.get('email','') }}">
    <label class="f" for="url">Link to the content (optional)</label>
    <input type="url" id="url" name="url" value="{{ form.get('url','') }}" placeholder="https://">
    <label class="f" for="details">What's the issue? If it's copyright, tell us which work you own.</label>
    <textarea id="details" name="details" required minlength="10">{{ form.get('details','') }}</textarea>
    <button class="btn" type="submit" style="margin-top:14px">Send report</button>
  </form>
</div>
{% endblock %}
