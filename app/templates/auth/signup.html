{% extends "base.html" %}
{% block title %}Create your account{% endblock %}
{% block content %}
<div class="auth card">
  <h1>Create your account</h1>
  <p class="sub">Free plan: 1 brand kit and 10 render minutes a month. No card needed.</p>
  <form method="post" novalidate>
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="f" for="name">Name or agency</label>
    <input type="text" id="name" name="name" value="{{ form.get('name','') }}" autocomplete="organization">
    <label class="f" for="email">Work email</label>
    <input type="email" id="email" name="email" required value="{{ form.get('email','') }}" autocomplete="email">
    <label class="f" for="password">Password (8+ characters)</label>
    <input type="password" id="password" name="password" required minlength="8" autocomplete="new-password">
    <label class="check"><input type="checkbox" name="terms" value="1" {{ 'checked' if form.get('terms') }}>
      <span>I agree to the <a href="{{ url_for('web.terms') }}" target="_blank">Terms</a> and <a href="{{ url_for('web.content_policy') }}" target="_blank">Content Policy</a>, and I'll only upload videos I own or am licensed to use.</span></label>
    <button class="btn block" type="submit" style="margin-top:8px">Create account</button>
  </form>
  <p class="muted small" style="margin-top:14px">Already have an account? <a href="{{ url_for('web.login') }}">Log in</a></p>
</div>
{% endblock %}
