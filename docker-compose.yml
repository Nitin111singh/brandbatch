services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brandbatch
      POSTGRES_PASSWORD: brandbatch
      POSTGRES_DB: brandbatch
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandbatch"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://brandbatch:brandbatch@db:5432/brandbatch
      ROLE: web
    ports: ["8000:8000"]
    volumes: [storage:/data/storage]
    depends_on: {db: {condition: service_healthy}}

  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://brandbatch:brandbatch@db:5432/brandbatch
      ROLE: worker
    volumes: [storage:/data/storage]
    depends_on: {db: {condition: service_healthy}}

volumes:
  pgdata:
  storage:
